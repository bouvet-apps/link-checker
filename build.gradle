plugins {
    id 'java'
    id 'maven-publish'
    id 'com.enonic.xp.app'
    id "com.github.node-gradle.node" version "7.1.0"
    id 'org.ajoberstar.grgit' version '5.0.0'
    id "com.github.ben-manes.versions" version '0.54.0'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = "${group}"
            artifactId = "${projectName}"
            version = "${version}"

            from components.java
        }
    }
}

app {
    keepArchiveFileName = true
}

sourceSets {
    main {
        resources {
            srcDir 'site'
        }
    }
}

tasks.named("jar") {
    dependsOn(":npmBuild")
}

task copyDist {
  dependsOn(':deploy')
  group 'application'
  description 'Copies jar file into dist folder'
  doLast {
    copy {
      from "build/libs/${projectName}-${version}.jar"
      into "dist/"
      rename ("${projectName}-${version}.jar", "${projectName}.jar")
    }
  }
}

task cleanDist(type: Delete) {
    delete "${rootDir}/dist/${projectName}.jar"
    println "Cleaned ${rootDir}/dist/${projectName}.jar"
}

task installWithCI(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies with ci, ignoring scripts'
) {
    inputs.files "package.json"
    outputs.dir "./node_modules"
    args = ['ci', '--ignore-scripts', '--quiet']
}

task installFrontendWithCI(
        type: NpmTask,
        group: 'node',
        description: 'Install frontend node dependencies with ci, ignoring scripts'
) {
    dependsOn 'installWithCI'
    workingDir = file('src/frontend')
    inputs.files "src/frontend/package.json", "src/frontend/package-lock.json"
    outputs.dir "src/frontend/node_modules"
    args = ['ci', '--ignore-scripts', '--quiet']
}

task npm_install(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies, ignoring scripts'
) {
    args = ['install', '--ignore-scripts', '--quiet']
}

task npmBuild(type: NpmTask,
        group: 'node',
        dependsOn: ['installWithCI', 'installFrontendWithCI'],
        description: 'Transpile ES6 files'
    ) {
    args = ['run', 'build']

    inputs.dir 'src/main/resources'
    inputs.dir 'src/frontend/scripts'
    inputs.dir 'src/frontend/styles'
    inputs.files 'src/frontend/package.json', 'src/frontend/webpack.config.js', 'src/frontend/tailwind.config.js'
    outputs.dir "$buildDir/resources/main"
}

rootProject.tasks.getByName('build').dependsOn npmBuild

build.finalizedBy(copyDist)

clean.dependsOn(cleanDist)

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    include xplibs.auth
    include xplibs.content
    include xplibs.context
    include xplibs.cluster
    include xplibs.i18n
    include xplibs.portal
    include xplibs.websocket
    include xplibs.node
    include xplibs.repo
    include xplibs.mail
    include xplibs.scheduler
    include xplibs.task
    include xplibs.io
    include libs.lib.cache
    include libs.lib.http.client
    include libs.lib.thymeleaf
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.enonic.com/public' }
}

node {
    // Version of node to use.
    version = '22.19.0'
    // Version of npm to use.
    npmVersion = '10.9.3'
    // If true, it will download node using above parameters.
    // If false, it will try to use globally installed node.
    download = true
}

wrapper {
    gradleVersion = '9.9.0'
    distributionType = Wrapper.DistributionType.BIN
}
