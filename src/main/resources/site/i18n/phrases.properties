path.x = Extra schema for the content type (left side editor, usually towards the bottom)
path.x.appId = ID of app that the extra schema belongs to
path.x.path = Path to the field in the extra schema

path.data = The schema of the content type (left side editor)
path.data.path = Path to the field in the content schema

path.components = Part or layout on the page (right side editor)
path.components.index = The {0} component on the page (Can be inside layout)
path.components.type = Type of component
path.components.appId = ID of the app that the {0} belongs to
path.components.componentId = ID of the {0}
path.components.path = Path to the field in the {0} schema

path.page = Type of component
path.page.components = Part, layout or page template (right side editor)
path.page.template = ID of page template content. (Editor controlled template, not a template from app)
path.page.appId = ID of the app that the page template belongs to
path.page.pageId = ID of the page template
path.page.path = Path to the field in the page schema

site.field = Email notification for site
site.from = 'From' email address
site.from.help = Email address that emails should be sent from. For example, no-reply@example.com. It is important that SMTP is correctly configured.
site.to = 'To' address for site report
site.to.help = This email address will receive an email each time a scheduled check is made for this site.
site.adminUrl = URL to admin page
site.adminUrl.help = Insert URL to admin page to include a link to ContentStudio in the email. Example: www.eksempel.no/admin
site.ownerFiled = Owner notification
site.alert = Email to owner of content if broken links are found
site.alert.help = Send an email to the owner of the content if a scheduled check finds broken links on that content.
site.suffix = Additional text in email
site.suffix.help = If you want site or company-specific text in the automatically generated email. For example: We are making an effort to improve the quality of our website, therefore we hold all content owners responsible for keeping it updated. Read more on slack channel '#example'
